version: "12.0"
description: Defines the public behavior and repository boundaries of @eliware/path.
directives:
  - id: E-103.0
    dos:
      - Accept ImportMeta values or directory strings as helper bases.
      - Derive filesystem paths from module URLs with native Node.js path behavior.
      - Convert file URLs to filesystem paths and filesystem paths to file URLs.
      - Keep runtime behavior and TypeScript declarations in sync.
      - Keep the package native ESM and support Node.js 26 or newer.
    donts:
      - Do not perform filesystem access or network I/O.
      - Do not contain absolute path segments or parent segments automatically.
    children:
      - id: E-103.0.0
        dos:
          - Treat string bases as directory paths.
          - Throw an error when a required base is missing or invalid.
          - Use the optional dirname function only with ImportMeta values.
        donts:
          - Do not treat a string base as a filename.
      - id: E-103.0.1
        dos:
          - Preserve the default path export and all documented named exports.
          - Keep every source module mirrored by one test module.
          - Keep path composition free of filesystem writes and process initialization.
        donts:
          - Do not add CommonJS exports or internal convenience entrypoints.
